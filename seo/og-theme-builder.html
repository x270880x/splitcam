<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#2878fc;--purple:#9c5bff;--text:#eeeeff;--sub:#9aa0c2;--green:#2ecc71}
body{margin:0}
.og{position:relative;width:1200px;height:630px;overflow:hidden;background:#0f0f1a;font-family:'Geist',sans-serif;color:var(--text)}
.og::before{content:'';position:absolute;width:760px;height:760px;right:-180px;top:-220px;background:radial-gradient(circle,var(--g1,rgba(40,120,252,.34)),transparent 62%);filter:blur(8px)}
.og::after{content:'';position:absolute;width:620px;height:620px;left:-160px;bottom:-260px;background:radial-gradient(circle,var(--g2,rgba(156,91,255,.26)),transparent 62%);filter:blur(8px)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;mask:radial-gradient(ellipse 90% 80% at 60% 40%,#000 30%,transparent 80%)}
.wrap{position:relative;z-index:2;height:100%;padding:56px 60px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:13px}
.brand img{width:42px;height:42px}
.brand b{font-size:34px;font-weight:800;letter-spacing:.5px}
.rating{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--sub);font-weight:600}
.rating .stars{color:#FFB400;font-size:17px;letter-spacing:1px}
.rating .dot{width:4px;height:4px;border-radius:50%;background:#46465c}
.body{flex:1;display:flex;align-items:center;gap:44px;margin-top:8px}
.left{flex:1;min-width:0}
.kick{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:rgba(40,120,252,.14);border:1px solid rgba(40,120,252,.4);font-size:14px;font-weight:700;color:#7ab1ff;letter-spacing:.7px;margin-bottom:22px;text-transform:uppercase}
.kick .live{width:8px;height:8px;border-radius:50%;background:#ff5454;box-shadow:0 0 10px #ff5454}
h1{font-size:70px;font-weight:800;line-height:.99;letter-spacing:-2.4px}
h1 .g{background:linear-gradient(100deg,#3d8bff,#a06bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{margin-top:22px;font-size:22px;line-height:1.4;color:var(--sub);max-width:540px;font-weight:500}
.sub b{color:var(--text);font-weight:700}
.badges{display:flex;gap:9px;margin-top:30px;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:15px;color:#c7cbe6;font-weight:600}
.bdg .ck{color:var(--blue);font-weight:800}
.card{width:392px;flex-shrink:0;background:rgba(28,28,46,.72);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;backdrop-filter:blur(8px);box-shadow:0 30px 70px -20px rgba(0,0,0,.6),0 0 0 1px rgba(40,120,252,.12)}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:16px;padding:0 4px}
.card-h .ld{width:9px;height:9px;border-radius:50%;background:var(--hd,#ff5454);box-shadow:0 0 10px var(--hd,#ff5454)}
.card-h .lt{font-size:13px;font-weight:800;color:var(--hd,#ff5454);letter-spacing:1px;font-family:'Geist Mono',monospace}
.card-h .li{font-size:13px;color:#7ab1ff;font-weight:600;margin-left:auto}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.035);margin-bottom:9px}
.row:last-child{margin-bottom:0}
.row svg{width:24px;height:24px;flex-shrink:0}
.row img{width:24px;height:24px;flex-shrink:0;object-fit:contain}
.row .nm{font-size:16.5px;font-weight:700;flex:1}
.row .kb{font-size:12.5px;color:#6f7398;font-family:'Geist Mono',monospace}
.row .gl{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}
.row .ck{color:var(--green);font-size:18px;font-weight:800}
.row .xk{color:#6f7398;font-size:18px;font-weight:800}
.more{text-align:center;font-size:14px;color:#6f7398;font-weight:600;padding-top:5px;font-family:'Geist Mono',monospace}
</style>
</head>
